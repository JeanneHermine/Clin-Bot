<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Réinitialisation — Cid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090e1a;
      --panel: rgba(22, 29, 49, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #0ea5e9;
      --accent-2: #0284c7;
      --danger: #f43f5e;
      --success: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.08), transparent 50%), var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .login-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      width: 100%;
      max-width: 440px;
      padding: 44px 36px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-container {
      text-align: center;
      margin-bottom: 36px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(14, 165, 233, 0.12);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid rgba(14, 165, 233, 0.2);
    }

    h1 {
      margin: 20px 0 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    form {
      display: grid;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
    }

    input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.4);
      color: var(--text);
      font: inherit;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(17, 24, 39, 0.6);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }

    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.25);
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(14, 165, 233, 0.45);
      filter: brightness(1.1);
    }

    button:active {
      transform: translateY(0);
    }

    .notice {
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(244, 63, 94, 0.1);
      color: var(--danger);
      border: 1px solid rgba(244, 63, 94, 0.2);
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-container">
      <div class="pill" style="gap: 6px; display: inline-flex; align-items: center;"><img src="/logo.jpeg" style="width: 16px; height: 16px; border-radius: 50%; object-fit: cover;" alt=""> Cid</div>
      <h1>Nouveau mot de passe</h1>
    </div>

    <form id="reset-form" onsubmit="handleResetPassword(event)">
      <input type="hidden" name="token" value="__RESET_TOKEN__" />

      <div class="form-group">
        <label>Nouveau mot de passe</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input name="mot_de_passe" type="password" required autocomplete="new-password" placeholder="Mot de passe sécurisé" />
        </div>
      </div>

      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input id="confirm_mot_de_passe" type="password" required autocomplete="new-password" placeholder="Ressaisissez le mot de passe" />
        </div>
      </div>

      <div id="reset-error" class="notice"></div>
      <div id="reset-success" style="padding: 14px 18px; border-radius: 14px; background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); font-size: 13px; display: none; align-items: center; gap: 10px; line-height: 1.4;"></div>

      <button type="submit" id="submit-btn"><i class="fa-solid fa-key"></i> Réinitialiser</button>
      
      <a href="/admin/login" id="login-link" style="text-align: center; color: var(--muted); font-size: 13px; text-decoration: none; margin-top: 12px; display: none;">Retour à la connexion</a>
    </form>
  </div>

  <script>
    async function handleResetPassword(e) {
      e.preventDefault();
      const errEl = document.getElementById('reset-error');
      const succEl = document.getElementById('reset-success');
      errEl.style.display = 'none';
      succEl.style.display = 'none';

      const pass = e.target.elements.mot_de_passe.value;
      const confirmPass = document.getElementById('confirm_mot_de_passe').value;

      if (pass !== confirmPass) {
        errEl.style.display = 'flex';
        errEl.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> Les mots de passe ne correspondent pas.`;
        return;
      }

      const payload = Object.fromEntries(new FormData(e.target).entries());

      try {
        const response = await fetch('/admin/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Erreur lors de la réinitialisation");
        }

        succEl.style.display = 'flex';
        succEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> ` + data.message;
        
        // Hide form inputs and submit button, show return to login link
        e.target.elements.mot_de_passe.disabled = true;
        document.getElementById('confirm_mot_de_passe').disabled = true;
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('login-link').style.display = 'block';
      } catch (err) {
        errEl.style.display = 'flex';
        errEl.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ` + err.message;
      }
    }
  </script>
</body>
</html>
